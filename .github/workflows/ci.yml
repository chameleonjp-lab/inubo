name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for iPhone testing
        if: github.event_name == 'pull_request'
        env:
          VITE_OFFICIAL_URL: ''
        run: |
          npm run build
          test -f dist/index.html
      - name: Upload the iPhone test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: inubo-iphone-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
