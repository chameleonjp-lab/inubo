name: Deploy Inubo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Read the GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build the game
        env:
          # Vite's relative base works at the Pages project subpath as well as at the preview root.
          VITE_OFFICIAL_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_INUBO_SUPABASE_URL: ${{ vars.INUBO_SUPABASE_URL }}
          VITE_INUBO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.INUBO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          test -f dist/index.html
      - name: Upload the Pages build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
